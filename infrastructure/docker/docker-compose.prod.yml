services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - user-service
      - finance-service
      - ml-service
      - notification-service
    networks:
      - app-network

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    command: sh -c "npm run build && npm run start"
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?Set NEXT_PUBLIC_API_BASE_URL in infrastructure/docker/.env}
    restart: unless-stopped
    networks:
      - app-network

  user-service:
    build:
      context: ../../backend/services/user-service
      dockerfile: Dockerfile
    command: sh -c "npm run build && npm run start"
    environment:
      NODE_ENV: production
      PORT: 8000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/financial_wellness
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in infrastructure/docker/.env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      INIT_DB_SCHEMA: "true"
      ALLOWED_ORIGINS: http://localhost
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8000/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - app-network

  finance-service:
    build:
      context: ../../backend/services/finance-service
      dockerfile: Dockerfile
    command: sh -c "npm run build && npm run start"
    environment:
      NODE_ENV: production
      PORT: 8001
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/financial_wellness
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in infrastructure/docker/.env}
      INIT_DB_SCHEMA: "true"
      ALLOWED_ORIGINS: http://localhost
      MONGODB_URL: mongodb://mongo:27017
      MONGODB_DB: financial_wellness_logs
      NOTIFICATION_QUEUE: ${NOTIFICATION_QUEUE:-notification_queue}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
      user-service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  ml-service:
    build:
      context: ../../backend/services/ml-service
      dockerfile: Dockerfile
    environment:
      PORT: 8002
      DB_URL: postgres://postgres:postgres@postgres:5432/financial_wellness
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      user-service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  notification-service:
    build:
      context: ../../backend/services/notification-service
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 8003
      REDIS_URL: redis://redis:6379
      NOTIFICATION_QUEUE: ${NOTIFICATION_QUEUE:-notification_queue}
      SENDER_EMAIL: ${SENDER_EMAIL:?Set SENDER_EMAIL in infrastructure/docker/.env}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST in infrastructure/docker/.env}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:?Set SMTP_USER in infrastructure/docker/.env}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Set SMTP_PASSWORD in infrastructure/docker/.env}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: financial_wellness
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d financial_wellness"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - app-network

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand({ ping: 1 }).ok\" | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  mongo_data:
