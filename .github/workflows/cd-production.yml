name: CD Production

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check deployment secrets
        id: check_secrets
        run: |
          if [ -z "${{ secrets.PROD_HOST }}" ]; then
            echo "::warning ::PROD_HOST is not set in GitHub secrets. Skipping SSH deployment."
            echo "has_secrets=false" >> $GITHUB_OUTPUT
          else
            echo "has_secrets=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to production host via SSH
        if: steps.check_secrets.outputs.has_secrets == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST || '127.0.0.1' }}
          username: ${{ secrets.PROD_USER || 'deploy' }}
          key: ${{ secrets.PROD_SSH_KEY || 'dummy' }}
          port: 22
          script_stop: true
          script: |
            set -e
            export APP_DIR="${{ secrets.PROD_APP_DIR }}"
            export BRANCH="main"
            if [ ! -d "$APP_DIR/.git" ]; then
              echo "App directory is not a git repo: $APP_DIR"
              exit 1
            fi
            cd "$APP_DIR"
            git fetch --all
            git checkout "$BRANCH"
            git reset --hard "origin/$BRANCH"
            chmod +x infrastructure/scripts/deploy.sh || true
            ./infrastructure/scripts/deploy.sh production

      - name: Health check
        if: steps.check_secrets.outputs.has_secrets == 'true' && secrets.PROD_HEALTHCHECK_URL != ''
        run: |
          curl -fsS "${{ secrets.PROD_HEALTHCHECK_URL }}" >/dev/null
